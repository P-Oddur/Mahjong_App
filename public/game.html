<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahjong</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shared/hand-dock.css">
  <link rel="stylesheet" href="shared/indicator.css">
</head>
<body>
<div id="game-wrap">
  <div id="game-header">
    <div id="status" class="status">Connecting...</div>
  </div>

  <div id="board">
    <div id="corner-tl"></div>
    <div id="player-top" class="player-area"></div>
    <div id="corner-tr"></div>

    <div id="player-left" class="player-area"></div>
    <div id="center">
      <div id="center-info">
        <span id="round-wind"></span>
        <span id="wall-info">Wall: --</span>
      </div>
      <div id="discard-pile"></div>
    </div>
    <div id="player-right" class="player-area"></div>

    <div id="corner-bl"></div>
    <div id="corner-br"></div>
  </div>

  <div id="action-bar">
<div id="action-buttons">
      <button id="btn-win" class="action-btn win-btn hidden">🏆 Win!</button>
      <button id="btn-discard" class="action-btn discard-btn hidden">Discard</button>
      <div id="self-panel" style="display:contents"></div>
      <div id="claim-panel" style="display:contents"></div>
    </div>
  </div>
  <div id="dock"></div>
</div>

<!-- Floating layer for action bubbles over seats (never cleared by render) -->
<div id="bubble-layer"></div>

<div id="chat-widget" class="chat-widget collapsed">
  <div class="chat-panel" id="chat-body">
    <div class="chat-log" id="chat-log"></div>
    <div class="emoji-bar" id="emoji-bar"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" maxlength="200" placeholder="Say something…" autocomplete="off">
      <button class="btn btn-secondary" id="chat-send" style="flex:0 0 auto;padding:8px 12px">Send</button>
    </div>
  </div>
  <button id="chat-toggle" class="chat-toggle">💬 Chat</button>
</div>

<div id="game-over" class="hidden">
  <div id="game-over-card">
    <h2 id="game-over-title">Game Over</h2>
    <div id="game-over-msg"></div>
    <div id="game-over-detail"></div>
    <div id="final-standings" class="hidden"></div>
    <div class="btn-row" style="justify-content:center;gap:12px;flex-wrap:wrap">
      <button class="btn btn-primary vote-btn hidden" id="btn-next-hand"><span class="vote-label">Next Hand</span><span class="vote-count" id="next-count"></span></button>
      <button class="btn btn-secondary vote-btn hidden" id="btn-vote-end"><span class="vote-label">End Match</span><span class="vote-count" id="end-count"></span></button>
      <button class="btn btn-secondary hidden" id="btn-lobby">Back to Lobby</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="mahjong.js"></script>
<script src="chat.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
