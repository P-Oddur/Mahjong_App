<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahjong</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="lobby-wrap">
  <div class="lobby-card" id="section-join">
    <div class="lobby-tiles">🀇🀙🀅🀃</div>
    <div class="lobby-title">Mahjong</div>
    <div class="lobby-subtitle">Hong Kong style · Play with friends</div>

    <!-- Step 1: log in (saves your balance) or continue as a guest -->
    <div id="entry">
      <div class="form-group">
        <label for="player-name">Your Name</label>
        <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="pin-input">4-digit PIN <span style="opacity:0.6;font-weight:400">— saves your balance</span></label>
        <input type="password" id="pin-input" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"
               style="letter-spacing:8px;text-align:center;font-size:1.2rem;font-weight:800">
      </div>
      <button class="btn btn-primary" id="btn-login" style="width:100%;margin-bottom:8px">Log in / Sign up</button>
      <button class="btn btn-ghost" id="btn-guest" style="width:100%">Play as guest</button>
      <div class="error-msg" id="login-error"></div>
    </div>

    <!-- Step 2: create or join a room -->
    <div id="ready" class="hidden">
      <div id="acct-banner" style="text-align:center;font-weight:700;margin-bottom:14px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.06)"></div>

      <button class="btn btn-primary" id="btn-create" style="width:100%;margin-bottom:10px">Create Room</button>

      <div class="divider">or join existing</div>

      <div class="form-group">
        <label for="room-code-input">Room Code</label>
        <input type="text" id="room-code-input" placeholder="4-letter code" maxlength="4" autocomplete="off"
               style="text-transform:uppercase;letter-spacing:4px;font-weight:800;font-size:1.2rem;text-align:center">
      </div>
      <button class="btn btn-secondary" id="btn-join" style="width:100%">Join Room</button>

      <div class="error-msg" id="error-msg"></div>
      <button class="btn btn-ghost" id="btn-switch" style="width:100%;margin-top:10px;opacity:0.75;font-size:0.85rem">← Log out / switch</button>
    </div>
  </div>

  <div class="lobby-card hidden" id="section-lobby">
    <div class="lobby-title" style="font-size:1.5rem;margin-bottom:4px">Room</div>
    <div class="room-code-display" id="room-code-display">----</div>
    <div class="room-code-hint">Share this code with friends</div>
    <div class="btn-row" style="margin-bottom:6px">
      <button class="btn btn-secondary" id="btn-copy-code">📋 Copy Code</button>
      <button class="btn btn-secondary" id="btn-copy-link">🔗 Copy Link</button>
    </div>
    <div id="copy-confirm" class="hidden" style="color:#4caf50;font-size:0.82rem;font-weight:600;min-height:18px;margin-bottom:10px">Copied to clipboard!</div>

    <ul class="players-list" id="players-list"></ul>

    <div id="lobby-actions">
      <div id="match-length-row" class="hidden" style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <label for="match-length" style="font-size:0.82rem;opacity:0.85;white-space:nowrap">Match length</label>
        <select id="match-length"
                style="flex:1;padding:10px;border-radius:8px;border:2px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.4);color:#fff;font-weight:700;cursor:pointer;outline:none">
          <option value="4">Full (東南西北)</option>
          <option value="2">East + South (東南)</option>
          <option value="1">East only (東圈)</option>
        </select>
      </div>
      <div id="match-length-info" class="hidden" style="font-size:0.82rem;opacity:0.85;margin-bottom:10px"></div>
      <div id="rules-summary" style="font-size:0.82rem;opacity:0.85;margin-bottom:10px"></div>
      <button class="btn btn-secondary hidden" id="btn-rules" style="width:100%;margin-bottom:10px">⚙ Scoring Rules</button>
      <div id="rules-panel" class="hidden" style="background:rgba(0,0,0,0.3);border:1px solid rgba(240,192,64,0.25);border-radius:10px;padding:10px;margin-bottom:10px;max-height:62vh;overflow:auto">
        <div id="rules-editor"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-secondary" id="btn-save-ruleset" style="flex:1">💾 Save as…</button>
          <a class="btn btn-ghost" href="/sandbox.html" target="_blank" rel="noopener" style="flex:1;text-align:center;text-decoration:none">🧪 Sandbox</a>
        </div>
        <div id="rules-save-msg" style="font-size:0.78rem;opacity:0.85;min-height:16px;margin-top:4px"></div>
      </div>
      <div id="add-bot-row" class="hidden" style="display:flex;gap:8px;margin-bottom:10px">
        <select id="bot-difficulty" title="New bot difficulty"
                style="flex:0 0 auto;padding:10px;border-radius:8px;border:2px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.4);color:#fff;font-weight:700;cursor:pointer;outline:none">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
        <button class="btn btn-secondary" id="btn-add-bot" style="flex:1">🤖 Add Bot</button>
      </div>
      <label id="mode3d-row" style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:0.85rem;cursor:pointer;user-select:none">
        <input type="checkbox" id="mode3d-toggle" style="width:18px;height:18px;cursor:pointer">
        <span>🀄 3D mode <span style="opacity:0.6;font-weight:400">— experimental first-person table</span></span>
      </label>
      <button class="btn btn-primary hidden" id="btn-start" style="width:100%">Start Game</button>
      <div class="waiting-hint hidden" id="waiting-hint">Waiting for host to start...</div>
      <button class="btn btn-ghost" id="btn-leave" style="width:100%;margin-top:10px">Leave Room</button>
    </div>

    <div class="chat-panel" id="lobby-chat">
      <div class="chat-log" id="chat-log"></div>
      <div class="emoji-bar" id="emoji-bar"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" maxlength="200" placeholder="Say something…" autocomplete="off">
        <button class="btn btn-secondary" id="chat-send" style="flex:0 0 auto;padding:8px 14px">Send</button>
      </div>
    </div>

    <div class="error-msg" id="lobby-error"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/ruleset-editor.js"></script>
<script src="chat.js"></script>
<script>
const socket = io();
let myIndex = null;
let myCode = null;
let myToken = null;
let isHost = false;
let myName = null;     // resolved display name (account name, or the guest's typed name)
let account = null;    // { token, name, balance } when logged in, else null
const AUTH_KEY = 'mjAuth';

const $ = id => document.getElementById(id);
// Escape user-controlled text (player names) before putting it in innerHTML.
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function showError(msg) { $('error-msg').textContent = msg; }
function showLobbyError(msg) { $('lobby-error').textContent = msg; }

function saveSession() {
  sessionStorage.setItem('mahjong', JSON.stringify({ code: myCode, playerIndex: myIndex, token: myToken }));
}
function clearSession() { sessionStorage.removeItem('mahjong'); }

// 3D-mode preference (per-browser). When on, the game opens the experimental
// first-person Three.js page instead of the 2D board. Additive: the 2D page
// stays the default and is left untouched.
function gamePage() { return localStorage.getItem('mahjong3d') === '1' ? '/game3d.html' : '/game.html'; }
(function init3dToggle() {
  const cb = $('mode3d-toggle');
  if (!cb) return;
  cb.checked = localStorage.getItem('mahjong3d') === '1';
  cb.addEventListener('change', () => localStorage.setItem('mahjong3d', cb.checked ? '1' : '0'));
})();

function showLobby() {
  $('room-code-display').textContent = myCode;
  $('section-join').classList.add('hidden');
  $('section-lobby').classList.remove('hidden');
  updateHostControls();
}

function updateHostControls() {
  $('btn-start').classList.toggle('hidden', !isHost);
  $('add-bot-row').classList.toggle('hidden', !isHost);
  $('match-length-row').classList.toggle('hidden', !isHost);
  $('match-length-info').classList.toggle('hidden', isHost);
  $('waiting-hint').classList.toggle('hidden', isHost);
  $('btn-rules').classList.toggle('hidden', !isHost);   // only the host edits the ruleset
  if (!isHost) $('rules-panel').classList.add('hidden');
}

// ── Scoring rules editor ─────────────────────────────────────────────────────
let rulesEditor = null, currentRuleset = null, rulesEditorSeeded = false, setRulesetTimer = null;
const MODE_LABEL = { 'hk-doubling': 'HK Doubling', 'hk-grouped': 'HK Grouped', 'mcr-additive': 'MCR Additive' };
function renderRulesSummary(rs) {
  if (rs) $('rules-summary').textContent = `Scoring: ${rs.name || 'Custom'} · ${MODE_LABEL[rs.mode] || rs.mode}`;
}
(async function initRulesEditor() {
  try {
    const catalog = await fetch('/api/catalog').then(r => r.json());
    rulesEditor = window.createRulesetEditor($('rules-editor'), catalog, currentRuleset || catalog.presets['hk-standard'], rs => {
      currentRuleset = rs;
      renderRulesSummary(rs);
      clearTimeout(setRulesetTimer);
      setRulesetTimer = setTimeout(() => { if (isHost) socket.emit('setRuleset', { ruleset: rs }); }, 250);
    });
    socket.emit('listRulesets');
  } catch (_) { /* editor is optional UI */ }
})();
$('btn-rules').addEventListener('click', () => $('rules-panel').classList.toggle('hidden'));
$('btn-save-ruleset').addEventListener('click', () => {
  if (!rulesEditor) return;
  const name = prompt('Save this ruleset to your account as:');
  if (name) socket.emit('saveRuleset', { name, ruleset: rulesEditor.getRuleset() });
});
socket.on('rulesetSaved', res => { $('rules-save-msg').textContent = res.ok ? '✓ Saved to your account.' : (res.error || 'Could not save.'); });
socket.on('rulesetList', res => { if (rulesEditor && res.ok) rulesEditor.setSavedPresets(res.rulesets || []); });

// Auto-rejoin if we already belong to a room (e.g. back from game page).
// Reads sessionStorage fresh on every (re)connect so creds are never stale.
function tryRejoin() {
  const s = JSON.parse(sessionStorage.getItem('mahjong') || '{}');
  if (s.code && s.token) {
    myCode = s.code;
    myToken = s.token;
    socket.emit('rejoin', { code: s.code, token: s.token });
  }
}
socket.on('connect', tryRejoin);
if (socket.connected) tryRejoin();

socket.on('rejoined', ({ code, playerIndex, isHost: host, state }) => {
  myCode = code;
  myIndex = playerIndex;
  isHost = host;
  saveSession();
  if (state === 'playing') { window.location.href = gamePage(); return; }
  showLobby();
});

socket.on('rejoinError', () => {
  clearSession();
  myCode = myToken = myIndex = null;
  $('section-lobby').classList.add('hidden');
  $('section-join').classList.remove('hidden');
  if (!account && !myName) showEntry();
});

socket.on('identityUpdate', ({ playerIndex, isHost: host }) => {
  myIndex = playerIndex;
  isHost = host;
  saveSession();
  updateHostControls();
});

// ── Account login (optional — guests skip it) ────────────────────────────────
function showEntry() {
  account = null;
  $('ready').classList.add('hidden');
  $('entry').classList.remove('hidden');
  $('login-error').textContent = '';
}
function showReady() {
  $('entry').classList.add('hidden');
  $('ready').classList.remove('hidden');
  $('acct-banner').innerHTML = account
    ? `✓ Logged in as <b>${escapeHtml(account.name)}</b> · 💰 ${account.balance}`
    : `Playing as guest: <b>${escapeHtml(myName)}</b><br><span style="font-weight:400;opacity:0.7;font-size:0.8rem">Sign in to save your balance</span>`;
}

$('btn-login').addEventListener('click', () => {
  const name = $('player-name').value.trim();
  const pin = $('pin-input').value;
  if (!name) { $('login-error').textContent = 'Enter a name'; return; }
  if (!/^\d{4}$/.test(pin)) { $('login-error').textContent = 'PIN must be exactly 4 digits'; return; }
  socket.emit('login', { name, pin });
});
$('btn-guest').addEventListener('click', () => {
  const name = $('player-name').value.trim();
  if (!name) { $('login-error').textContent = 'Enter a name'; return; }
  account = null; myName = name;
  showReady();
});
$('btn-switch').addEventListener('click', () => {
  if (account) socket.emit('logout', { token: account.token });
  localStorage.removeItem(AUTH_KEY);
  account = null; myName = null;
  $('pin-input').value = '';
  showEntry();
});
$('player-name').addEventListener('keydown', e => { if (e.key === 'Enter') $('pin-input').focus(); });
$('pin-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-login').click(); });

socket.on('loginResult', res => {
  if (!res.ok) { $('login-error').textContent = res.error || 'Login failed'; return; }
  account = { token: res.token, name: res.name, balance: res.balance };
  myName = res.name;
  localStorage.setItem(AUTH_KEY, JSON.stringify({ token: res.token, name: res.name }));
  showReady();
});

// Resume a stored login on page load.
(function restoreLogin() {
  try {
    const a = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
    if (a && a.token) { $('player-name').value = a.name || ''; socket.emit('authToken', { token: a.token }); }
  } catch (_) {}
})();

// ── Create / join (only reachable once logged in or in guest mode) ────────────
$('btn-create').addEventListener('click', () => {
  if (!myName) { showError('Log in or continue as a guest first'); return; }
  socket.emit('createRoom', { playerName: myName });
});
$('btn-join').addEventListener('click', doJoin);
$('room-code-input').addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(); });

function doJoin() {
  if (!myName) { showError('Log in or continue as a guest first'); return; }
  const code = $('room-code-input').value.trim().toUpperCase();
  if (code.length !== 4) { showError('Enter a 4-letter room code'); return; }
  socket.emit('joinRoom', { playerName: myName, code });
}

socket.on('roomCreated', ({ code, playerIndex, token }) => {
  myCode = code; myIndex = playerIndex; myToken = token; isHost = true;
  saveSession();
  showLobby();
});

socket.on('roomJoined', ({ code, playerIndex, token }) => {
  myCode = code; myIndex = playerIndex; myToken = token; isHost = false;
  saveSession();
  showLobby();
});

socket.on('joinError', msg => showError(msg));
socket.on('error', msg => { const m = typeof msg === 'string' ? msg : msg.msg; showError(m); showLobbyError(m); });

socket.on('roomUpdate', (room) => {
  const winds = { east:'東', south:'南', west:'西', north:'北' };
  const diffColor = { easy: '#4caf50', normal: '#f0c040', hard: '#ff6b6b' };
  const list = $('players-list');
  list.innerHTML = '';
  room.players.forEach((p, i) => {
    const li = document.createElement('li');
    li.innerHTML = `
      <span>${p.isBot ? '🤖 ' : ''}${escapeHtml(p.name)}${p.account && p.balance != null ? ` <span style="opacity:0.7;font-size:0.78rem">💰${p.balance}</span>` : ''}</span>
      <span class="player-wind-badge">${winds[p.seatWind] || p.seatWind}</span>
      ${p.isBot ? `<span class="player-wind-badge" style="color:${diffColor[p.difficulty] || '#fff'};text-transform:capitalize">${p.difficulty || 'normal'}</span>` : ''}
      ${i === 0 ? '<span class="host-badge">HOST</span>' : ''}
      ${!p.isBot && !p.connected ? '<span style="opacity:0.5;font-size:0.75rem">disconnected</span>' : ''}
    `;
    if (isHost && p.isBot) {
      const btn = document.createElement('button');
      btn.className = 'bot-remove-btn';
      btn.textContent = '✕';
      btn.title = 'Remove bot';
      btn.addEventListener('click', () => socket.emit('removeBot', { index: i }));
      li.appendChild(btn);
    }
    list.appendChild(li);
  });

  const MATCH_LABELS = { 1: 'East only (東圈)', 2: 'East + South (東南)', 4: 'Full (東南西北)' };
  const mr = room.matchRounds || 4;
  $('match-length').value = String(mr);
  $('match-length-info').textContent = `Match: ${MATCH_LABELS[mr]}`;

  if (room.ruleset) {
    currentRuleset = room.ruleset;
    renderRulesSummary(room.ruleset);
    // Reflect the room's ruleset in the editor — for everyone on first sight, and
    // for non-hosts always; never clobber the host mid-edit after they've seeded.
    if (rulesEditor && (!isHost || !rulesEditorSeeded)) { rulesEditor.setRuleset(room.ruleset); rulesEditorSeeded = true; }
  }

  if (isHost) {
    $('btn-start').disabled = room.players.length < 4;
    $('btn-start').textContent = room.players.length < 4 ? `Need 4 players (${room.players.length}/4)` : 'Start Game';
    $('add-bot-row').classList.toggle('hidden', room.players.length >= 4);
  }
});

socket.on('gameStarted', () => {
  saveSession();
  window.location.href = gamePage();
});

socket.on('leftRoom', () => {
  clearSession();
  window.location.reload();
});

// ── Share / invite link ───────────────────────────────────────────────────
// Pre-fill the join code from an invite link like  http://host:3000/?code=ABCD
const inviteCode = new URLSearchParams(location.search).get('code');
if (inviteCode) {
  $('room-code-input').value = inviteCode.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  $('player-name').focus();
}

function flashCopied() {
  const el = $('copy-confirm');
  el.classList.remove('hidden');
  clearTimeout(flashCopied._t);
  flashCopied._t = setTimeout(() => el.classList.add('hidden'), 1500);
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // Fallback for non-secure contexts (e.g. plain http on a LAN IP)
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch {}
    document.body.removeChild(ta);
  }
  flashCopied();
}
$('btn-copy-code').addEventListener('click', () => { if (myCode) copyText(myCode); });
$('btn-copy-link').addEventListener('click', () => { if (myCode) copyText(`${location.origin}/?code=${myCode}`); });

$('btn-start').addEventListener('click', () => socket.emit('startGame'));
$('btn-add-bot').addEventListener('click', () => socket.emit('addBot', { difficulty: $('bot-difficulty').value }));
$('match-length').addEventListener('change', () => socket.emit('setMatchLength', { rounds: Number($('match-length').value) }));
$('btn-leave').addEventListener('click', () => socket.emit('leaveRoom'));

// ── Chat — handled by the shared module (chat.js / window.MahjongChat) ──
MahjongChat.initChat(socket);
</script>
</body>
</html>
